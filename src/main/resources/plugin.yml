name: InstantNetherPortals
version: '${project.version}'
main: de.emilo.instantnetherportals.InstantNetherPortals
api-version: '${plugin.api-version}'
description: Instant Nether portal teleportation with a configurable delay
authors: [EmilDeuOfficial]
website: https://github.com/EmilDeuOfficial/InstantNetherPortals

commands:
  instantportal:
    description: Toggle or configure InstantNetherPortals
    usage: /<command> [on|off|reload|status]
    permission: instantnetherportals.admin
    aliases: [inp]

permissions:
  instantnetherportals.use:
    description: Use instant Nether portal teleportation
    default: op
  instantnetherportals.admin:
    description: Use /instantportal to toggle, reload and show the status
    default: op
